# Unverified: written without running Docker. See ops/deploy.md.
# The dashboard binds 0.0.0.0 INSIDE its container only because Docker cannot forward to a container
# loopback; every published port must start with "127.0.0.1:" (a unit test enforces this).
# Broker and notifier secrets arrive at runtime through .env (chmod 600, never in git, never in
# the image) and reach the worker only. The dashboard has no env_file; compose reads .env itself
# for the two pass-throughs below, and the dashboard sees nothing else from it.
x-guard: &guard
  build: .
  restart: unless-stopped
  read_only: true
  tmpfs: ["/tmp"]
  cap_drop: [ALL]
  security_opt: ["no-new-privileges:true"]
  volumes: ["guard-data:/data"]
  environment:
    GUARD_DATA_DIR: /data
    TZ: Europe/London
    HOME: /tmp

services:
  worker:
    <<: *guard
    env_file: .env
    command: ["python", "-m", "guard.worker"]
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD", "python", "-m", "guard.worker", "status", "--check", "--scheduler"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 1m
  dashboard:
    <<: *guard
    environment:
      GUARD_DATA_DIR: /data
      TZ: Europe/London
      HOME: /tmp
      GUARD_ALLOWED_USERS: ${GUARD_ALLOWED_USERS:-}
      GUARD_DASHBOARD_PASSWORD: ${GUARD_DASHBOARD_PASSWORD:-}
    command:
      - streamlit
      - run
      - src/guard/ui/app.py
      - --server.address=0.0.0.0
      - --server.port=8501
      - --server.headless=true
      - --browser.gatherUsageStats=false
    ports: ["127.0.0.1:8501:8501"]
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 200
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 1m
      timeout: 10s
      retries: 3
      start_period: 30s

volumes:
  guard-data:
