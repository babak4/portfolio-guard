default_install_hook_types: [pre-commit, pre-push]
exclude: ^tests/golden/
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
  - repo: local
    hooks:
      - id: ruff
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: mypy
        name: mypy
        entry: uv run mypy src/guard
        language: system
        types: [python]
        pass_filenames: false
      - id: pytest
        name: unit tests
        entry: uv run pytest -m "not live and not perf" --ignore=tests/integration -q
        language: system
        pass_filenames: false
        always_run: true
        stages: [pre-push]
