# Parameter grid and study settings for the Phase 0 backtest. The safe asset axis is not listed
# here: it is every named safe series handed to the sweep. `quick_grid` is the --quick subset.
grid:
  trend_window: [150, 200, 250]          # trading days
  drawdown_threshold: [0.08, 0.10, 0.15]
  volatility_threshold: [0.20, 0.25, 0.30]
  confirmation_runs: [1, 2, 3]
  cadence: [weekly, monthly]
  weekday: [0, 1, 2, 3, 4]               # 0 = Monday
  mode: [full, realistic]

quick_grid:
  trend_window: [150, 200, 250]
  drawdown_threshold: [0.08, 0.10, 0.15]
  volatility_threshold: [0.20, 0.25, 0.30]
  confirmation_runs: [2]
  cadence: [weekly]
  weekday: [2]
  mode: [full]

targets:
  crisis_max_drawdown: 0.20              # owner decision (2026-11-08): drawdown within about -20% in each crisis
  annual_lag_pct: 1.0                    # PRD: lag no worse than 1% a year
  lag_window_years: 3                    # over rolling windows of this length

plateau:
  tolerance: 0.15                        # neighbours within this share of the centre value
  floors:                                # absolute floor under the relative test near zero
    max_drawdown: 0.01
    worst_lag: 0.25
  objective: calmar
  pairs:                                 # parameter pairs shown as tables
    - [trend_window, drawdown_threshold]
    - [drawdown_threshold, volatility_threshold]
    - [confirmation_runs, trend_window]

walk_forward:
  train_years: 8                         # first training window [start, start + train_years]
  test_years: 3                          # out-of-sample block, then roll by the same length
  min_test_days: 180                     # drop a final block shorter than this
  objective: calmar
  tie_tolerance: 0.02                    # scores this close tie toward the setting nearer default
  pinned:                                # axes held fixed while walking forward
    mode: full

weekday_offsets:
  offsets: 4                             # weekly start offsets: 0 .. offsets - 1 weeks
  metric: calmar

data:
  rate_series_max_gap_days: 40           # monthly rate series are far apart
