[project]
name = "portfolio-guard"
version = "0.1.0"
description = "Advice-only drawdown-protection advisor for a long-term UK ETF portfolio"
requires-python = ">=3.14,<3.15"
dependencies = [
  "duckdb>=1.1",
  "pydantic>=2.7",
  "pyyaml>=6",
  "structlog>=24",
  "numpy>=2",
  "pandas>=2.2",
  "httpx>=0.27",
  "apscheduler>=3.10,<4",
  "apprise>=1.9",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-socket>=0.7",
  "hypothesis>=6.100",
  "ruff>=0.6",
  "mypy>=1.11",
  "types-PyYAML",
  "pandas-stubs",
]

[project.optional-dependencies]
market = ["yfinance>=0.2.50"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/guard"]
artifacts = ["src/guard/storage/migrations/**/*.sql", "src/guard/config/defaults/*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra --strict-markers --disable-socket --allow-unix-socket"
markers = [
  "live: hits real network/APIs; never run in CI",
  "perf: performance budget tests; run explicitly with -m perf",
]

[tool.ruff]
line-length = 100
target-version = "py314"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.14"
plugins = ["pydantic.mypy"]
ignore_missing_imports = true
check_untyped_defs = true
files = ["src/guard"]

[[tool.mypy.overrides]]
module = ["guard.signals.*", "guard.ladder.*", "guard.advice.*", "guard.storage.*", "guard.config.*"]
strict = true

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
